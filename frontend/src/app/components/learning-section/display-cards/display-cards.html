@if (loading()) {
  <p>Wczytywanie fiszek...</p>
} @else if (loadError()) {
  <div class="display-card">
    <p>Nie udało się pobrać fiszek.</p>
    <button class="submit-button" type="button" (click)="loadFlashcards()">Spróbuj ponownie</button>
  </div>
} @else if (cards().length === 0) {
  <div class="display-card">
    <p>Brak dostępnych pytań.</p>
  </div>
} @else if (finished()) {
  <div class="display-card">
    <p>To już wszystkie fiszki.</p>
  </div>
} @else {
  <div class="display-card">
    <div class="display-card-header">
      <h2>Pytanie #{{ currentIndex() + 1 }}</h2>
    </div>

    <div class="display-card-content">
      <p class="question-text">{{ currentCard().question }}</p>
      <div class="answer-window">
        <textarea
          placeholder="Wpisz swoją odpowiedź tutaj..."
          [value]="answer()"
          (input)="updateAnswer($any($event.target).value)"
        ></textarea>
      </div>
    </div>
    <div class="button-wrapper">
      <button class="return-button" type="button" (click)="returnToMenu()">Powrót do menu</button>
      <button
        class="submit-button"
        type="button"
        [disabled]="!answer().trim()"
        (click)="submitAnswer()"
      >
        {{ currentIndex() + 1 === cards().length ? 'Zakończ zestaw' : 'Prześlij odpowiedź' }}
      </button>
    </div>
  </div>
}
