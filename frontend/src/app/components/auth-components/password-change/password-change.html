<h1>Reset hasła</h1>
<p>Podaj adres e-mail powiązany z kontem, aby otrzymać link do zmiany hasła.</p>
<form (ngSubmit)="submit()" #resetForm="ngForm">
  <label>
    E-mail
    <input type="email" name="email" [(ngModel)]="email" autocomplete="email" required />
  </label>
  @if (errorMessage) {
    <p class="message error" role="alert">{{ errorMessage }}</p>
  }
  @if (successMessage) {
    <p class="message success" role="status">{{ successMessage }}</p>
  }
  <button type="submit" [disabled]="resetForm.invalid || isSubmitting">
    {{ isSubmitting ? 'Wysyłanie…' : 'Wyślij link' }}
  </button>
</form>
<p><a routerLink="/auth/login">Wróć do logowania</a></p>
