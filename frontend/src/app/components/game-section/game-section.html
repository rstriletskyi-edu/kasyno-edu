<div class="game-card">
  <div class="card-header">
    <div class="icon-wrapper">
      <span>🎰</span>
    </div>
    <h2>Kasyno &amp; Gry</h2>
  </div>

  <p class="description">
    Wybierz grę i sprawdź swoje szczęście! Przepal efekty swojej nauki! Dbaj o złe nawyki!
  </p>

  <game-window [selectedGame]="selectedGame()?.id ?? null" />

  @if (selectedGame()) {
    <button type="button" class="play-button" [disabled]="loading()" (click)="playGame()">
      Graj
    </button>
  }

  @if (error()) {
    <div class="error-banner" role="alert">
      <p>{{ errorMessage() }}</p>
    </div>
  }

  <div class="dropdown-wrapper">
    <button type="button" class="dropdown-toggle" (click)="toggleDropdown()">
      @if (selectedGame(); as game) {
        <span>{{ game.icon }} {{ game.name }}</span>
      } @else {
        <span>Wybierz grę 🎲</span>
      }
      <span class="dropdown-arrow" [class.open]="dropdownOpen()">▾</span>
    </button>
    @if (dropdownOpen()) {
      <ul class="dropdown-menu">
        @for (game of games; track game.id) {
          <li class="dropdown-item">
            <button
              type="button"
              [class.active]="selectedGame()?.id === game.id"
              (click)="selectGame(game)"
            >
              {{ game.icon }} {{ game.name }}
            </button>
          </li>
        }
      </ul>
    }
  </div>
</div>
