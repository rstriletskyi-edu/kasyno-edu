<div class="game-card">
  <div class="card-header">
    <div class="icon-wrapper">
      <span>🎰</span>
    </div>
    <h2>Kasyno &amp; Gry</h2>
  </div>

  <p class="description">
    Wybierz grę i sprawdź swoje szczęście! Graj odpowiedzialnie — to tylko żetony edukacyjne.
  </p>

  <div class="game-badges">
    <span class="badge">Ruletka</span>
    <span class="badge">Blackjack</span>
    <span class="badge">Slots</span>
  </div>

  <div class="dropdown-wrapper">
    <button class="dropdown-toggle" (click)="toggleDropdown()">
      Wybierz grę 🎲
      <span class="dropdown-arrow" [class.open]="dropdownOpen()">▾</span>
    </button>
    @if (dropdownOpen()) {
      <ul class="dropdown-menu">
        @for (game of games; track game.name) {
          <li class="dropdown-item">
            <!--
              zmienić na przyciski nie linki/hrefy i inne, 
              bo one resetują stan strony, odświeżając ją. 
              Menu ma się zwinąć i wywołać odpowiedni komponent gry,
              zamiast nawigować na ten sam adres
            -->
            <!--
              coś w tym stylu:
                """
                  <button (click)="switchGame(gameid)">{{ game.icon }} {{ game.name }}</button>
                """

                switchGame() należy wtedy zaimplementować, a 
                nawigacja będzie w ramach komponentu <game /> 
              -->
            <a href="#">{{ game.icon }} {{ game.name }}</a>
          </li>
        }
      </ul>
    }
  </div>
</div>
