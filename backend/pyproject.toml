[project]
name = "kasyno-edu-backend"
version = "0.1.0"
description = "FastAPI backend for Kasyno Edu"
requires-python = ">=3.13,<4.0"
dependencies = ["fastapi (>=0.162.2,<0.163.0)", "uvicorn[standard] (>=0.54.0,<0.55.0)", "pydantic-settings (>=2.16.2,<3.0.0)", "firebase-admin (>=7.7.0,<8.0.0)"]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "httpx2 (>=2.16.0,<3.0.0)",
]
