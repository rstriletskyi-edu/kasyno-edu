services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    profiles: ["tools"]
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
  frontend:
    image: ghcr.io/rstriletskyi-edu/kasyno-edu/frontend:${IMAGE_TAG}
    restart: unless-stopped


  backend:
    image: ghcr.io/rstriletskyi-edu/kasyno-edu/backend:${IMAGE_TAG}
    env_file: .env
    volumes:
      - ./credentials:/app/credentials:ro
    restart: unless-stopped
