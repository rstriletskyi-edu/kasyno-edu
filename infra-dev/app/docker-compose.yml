services:
  nginx:
    image: nginxinc/nginx-unprivileged:stable-alpine
    ports:
      - "80:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    image: <registry>/kasyno-frontend:${IMAGE_TAG}
    restart: unless-stopped

  backend:
    image: <registry>/kasyno-backend:${IMAGE_TAG}
    env_file: .env
    volumes:
      - ./credentials:/app/credentials:ro
    restart: unless-stopped