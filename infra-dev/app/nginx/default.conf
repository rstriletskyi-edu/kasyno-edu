server {
    listen 80;
    server_name dev.edu-kasyno.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


server {
    listen 443 ssl;
    http2 on;
    server_name dev.edu-kasyno.online;
    resolver 127.0.0.11 valid=10s;

    ssl_certificate     /etc/letsencrypt/live/dev.edu-kasyno.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.edu-kasyno.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $frontend_upstream http://frontend:8080;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
    }
}