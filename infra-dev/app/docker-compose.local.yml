services:
  nginx:
    image: nginxinc/nginx-unprivileged:stable-alpine
    ports:
      - "80:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

  frontend:
    image: kasyno-frontend

  backend:
    image: kasyno-backend
    env_file: ../../backend/.env
    volumes:
      - ../../backend/credentials:/app/credentials:ro