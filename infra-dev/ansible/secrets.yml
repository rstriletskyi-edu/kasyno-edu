- name: Put app secrets on the dev server
  hosts: dev
  become: true
  tasks:
    - name: Create app folders
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: ubuntu
        mode: "0755"
      loop:
        - /opt/kasyno
        - /opt/kasyno/credentials

    - name: Copy backend .env
      ansible.builtin.copy:
        src: secrets/dev.env
        dest: /opt/kasyno/.env
        owner: ubuntu
        mode: "0600"

    - name: Copy Firebase key
      ansible.builtin.copy:
        src: secrets/firebase-service-account.json
        dest: /opt/kasyno/credentials/firebase-service-account.json
        owner: "1001"
        mode: "0400"
