name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Check changed directories
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

  frontend:
    name: Frontend checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set npm version
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier src --check

      - name: Run tests
        run: npm test -- --watch=false

      - name: Build application
        run: npm run build -- --configuration production

  backend:
    name: Backend checks
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POETRY_NO_INTERACTION: "1"
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: python -m pip install "poetry==2.5.0"

      - name: Validate dependencies
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --with dev --no-root --no-ansi

      - name: Check Python syntax
        run: poetry run python -m compileall -q src tests

      - name: Run tests
        run: poetry run pytest

  ci-gate:
    name: CI Gate
    needs: [changes, frontend, backend]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify job statuses
        env:
          CHANGES: ${{ needs.changes.result }}
          FRONTEND: ${{ needs.frontend.result }}
          BACKEND: ${{ needs.backend.result }}
        run: |
          if [[ "$CHANGES" != "success" ]]; then
            echo "Change detection failed or was cancelled."
            exit 1
          fi

          for result in "$FRONTEND" "$BACKEND"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "A required check failed or was cancelled."
                exit 1
                ;;
            esac
          done

          echo "All applicable checks passed."