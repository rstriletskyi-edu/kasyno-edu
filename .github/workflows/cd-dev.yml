name: CD (dev)

on:
  push:
    branches: [main]

concurrency:
  group: cd-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  frontend-ci:
    name: Frontend checks
    uses: ./.github/workflows/ci-frontend.yml

  backend-ci:
    name: Backend checks
    uses: ./.github/workflows/ci-backend.yml

  images:
    name: Build and push ${{ matrix.name }}
    needs: [frontend-ci, backend-ci]
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
            build_args: ""
          - name: frontend
            context: frontend
            build_args: |
              API_URL=/api
              FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }}
              FIREBASE_AUTH_DOMAIN=${{ vars.FIREBASE_AUTH_DOMAIN }}
              FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
              FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}

  deploy:
    name: Deploy to dev server
    needs: images
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host dev-server
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
          EOF

      - name: Copy compose and nginx config
        run: |
          scp -r infra-dev/app/docker-compose.yml infra-dev/app/nginx dev-server:/opt/kasyno/

      - name: Log in to GHCR on the server
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | ssh dev-server "docker login ghcr.io -u $GH_ACTOR --password-stdin"

      - name: Deploy and check health
        run: |
          ssh dev-server "NEW_TAG=${{ github.sha }} bash -s" <<'EOF'
          set -uo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          cd /opt/kasyno
          PREV=$(cat .image_tag 2>/dev/null || true)

          export IMAGE_TAG="$NEW_TAG"
          docker compose pull
          docker compose up -d --remove-orphans

          for i in $(seq 1 30); do
            if curl -fsS http://localhost/api/health >/dev/null; then
              echo "$NEW_TAG" > .image_tag
              echo "Deploy OK: $NEW_TAG"
              exit 0
            fi
            sleep 5
          done

          echo "Health check failed."
          if [ -n "$PREV" ]; then
            echo "Rolling back to $PREV"
            IMAGE_TAG="$PREV" docker compose up -d --remove-orphans
          fi
          exit 1
          EOF